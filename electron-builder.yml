appId: com.businessiq.app
productName: BusinessIQ
directories:
  buildResources: public
  output: dist_electron_build

files:
  - dist/**
  - electron-main.js
  - electron-preload.js
  - sqliteDB.js
  - package.json
  - node_modules/better-sqlite3/**

asar: true
asarUnpack:
  - dist/**
  - node_modules/better-sqlite3/**
  - "*.node"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icons/icon.ico
  forceCodeSigning: false
  publisherName: BusinessIQ

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BusinessIQ

portable:
  artifactName: BusinessIQ-${version}-portable.exe

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: public/icons/icon-512x512.png

linux:
  target:
    - AppImage
  category: Office
  icon: public/icons/icon-512x512.png

publish:
  provider: github
  owner: YOUR_GITHUB_USERNAME
  repo: businessiq-desktop
  vPrefixedTagName: true
  releaseType: release
