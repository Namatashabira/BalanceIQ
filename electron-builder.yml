appId: com.businessiq.app
productName: BusinessIQ
directories:
  buildResources: public
  output: dist_electron

files:
  - dist/**
  - electron-main.js
  - electron-preload.js
  - sqliteDB.js
  - package.json
  - node_modules/better-sqlite3/**

asarUnpack:
  - node_modules/better-sqlite3/**
  - "*.node"

win:
  target:
    - nsis
    - portable
  icon: public/icons/icon-512x512.png
  signingHashAlgorithms: null
  forceCodeSigning: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BusinessIQ

portable:
  artifactName: BusinessIQ-${version}-portable.exe

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: public/icons/icon-512x512.png

linux:
  target:
    - AppImage
  category: Office
  icon: public/icons/icon-512x512.png

publish:
  provider: github
  owner: your-org
  repo: businessiq-desktop
  vPrefixedTagName: true
