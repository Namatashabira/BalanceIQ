appId: com.businessiq.app
productName: BusinessIQ
directories:
  buildResources: public
  output: dist

files:
  - dist/**
  - electron-main.js
  - electron-preload.js
  - sqliteDB.js
  - package.json
  - node_modules/better-sqlite3/**

asarUnpack:
  - node_modules/better-sqlite3/**
  - "*.node"

win:
  target:
    - nsis
    - portable
    - msi
  certificateFile: null
  certificatePassword: null
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BusinessIQ

portable:
  artifactName: BusinessIQ-${version}-portable.exe

msi:
  artifactName: BusinessIQ-${version}.msi

mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  certificateFile: null
  certificatePassword: null
  identity: null

dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 438
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - deb
  category: Office
  artifactName: BusinessIQ-${version}.${ext}

deb:
  afterInstall: scripts/after-install.sh

AppImage:
  artifactName: BusinessIQ-${version}.AppImage

publish:
  provider: github
  owner: your-org
  repo: businessiq-desktop
  vPrefixedTagName: true

snap:
  publish:
    - provider: snapStore
      channels:
        - edge
