<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend-Backend Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        #results { margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Frontend-Backend Connection Test</h1>
    
    <div class="test-section">
        <h3>Test 1: Fetch Orders</h3>
        <button onclick="testFetchOrders()">Test Fetch Orders</button>
        <div id="fetch-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 2: Create Order</h3>
        <button onclick="testCreateOrder()">Test Create Order</button>
        <div id="create-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 3: Update Order Status</h3>
        <input type="number" id="order-id" placeholder="Order ID" />
        <select id="new-status">
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
        </select>
        <button onclick="testUpdateOrder()">Test Update Order</button>
        <div id="update-result"></div>
    </div>
    
    <div id="results"></div>

    <script>
        const BASE_URL = "http://localhost:8000/api";
        
        function log(message, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            results.appendChild(div);
        }
        
        async function testFetchOrders() {
            const resultDiv = document.getElementById('fetch-result');
            try {
                const response = await fetch(`${BASE_URL}/core/orders/`);
                if (response.ok) {
                    const orders = await response.json();
                    resultDiv.innerHTML = `<span class="success">✅ Success: Found ${orders.length} orders</span>`;
                    log(`Fetched ${orders.length} orders successfully`);
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log(`Fetch orders failed: ${error.message}`, true);
            }
        }
        
        async function testCreateOrder() {
            const resultDiv = document.getElementById('create-result');
            const orderData = {
                customer_name: "Test Customer",
                customer_email: "test@example.com",
                phone_number: "123456789",
                location: "Test Location",
                order_type: "retail",
                delivery: true,
                order_items: [
                    {
                        product_name: "Test Product",
                        quantity: 2,
                        price: 25.00
                    }
                ]
            };
            
            try {
                const response = await fetch(`${BASE_URL}/core/user/orders/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });
                
                if (response.ok) {
                    const order = await response.json();
                    resultDiv.innerHTML = `<span class="success">✅ Success: Created order #${order.id}</span>`;
                    log(`Created order #${order.id} successfully`);
                    document.getElementById('order-id').value = order.id;
                } else {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log(`Create order failed: ${error.message}`, true);
            }
        }
        
        async function testUpdateOrder() {
            const resultDiv = document.getElementById('update-result');
            const orderId = document.getElementById('order-id').value;
            const newStatus = document.getElementById('new-status').value;
            
            if (!orderId) {
                resultDiv.innerHTML = `<span class="error">❌ Please enter an order ID</span>`;
                return;
            }
            
            const updateData = {
                id: parseInt(orderId),
                status: newStatus
            };
            
            try {
                const response = await fetch(`${BASE_URL}/core/orders/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updateData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    resultDiv.innerHTML = `<span class="success">✅ Success: Updated order #${result.id} to ${result.status}</span>`;
                    log(`Updated order #${result.id} to ${result.status} successfully`);
                } else {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log(`Update order failed: ${error.message}`, true);
            }
        }
        
        // Test connection on page load
        window.onload = function() {
            log('Page loaded. Ready to test connection.');
        };
    </script>
</body>
</html>
