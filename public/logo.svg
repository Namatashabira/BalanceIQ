<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Main background gradient: deep navy to indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>

    <!-- Text shimmer gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="40%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#a5b4fc"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>

    <!-- Inner ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square background -->
  <rect width="120" height="120" rx="28" ry="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Decorative corner accent top-left -->
  <circle cx="0" cy="0" r="40" fill="#3b82f6" opacity="0.08"/>

  <!-- Decorative corner accent bottom-right -->
  <circle cx="120" cy="120" r="40" fill="#6366f1" opacity="0.10"/>

  <!-- Subtle grid dots -->
  <circle cx="22" cy="22" r="1.2" fill="#60a5fa" opacity="0.25"/>
  <circle cx="40" cy="22" r="1.2" fill="#60a5fa" opacity="0.15"/>
  <circle cx="22" cy="40" r="1.2" fill="#60a5fa" opacity="0.15"/>
  <circle cx="98" cy="98" r="1.2" fill="#818cf8" opacity="0.25"/>
  <circle cx="80" cy="98" r="1.2" fill="#818cf8" opacity="0.15"/>
  <circle cx="98" cy="80" r="1.2" fill="#818cf8" opacity="0.15"/>

  <!-- Inner ring / halo -->
  <rect x="8" y="8" width="104" height="104" rx="22" ry="22" fill="none" stroke="url(#ringGrad)" stroke-width="1.2"/>

  <!-- Thin accent line top -->
  <line x1="30" y1="8" x2="90" y2="8" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- BIQ text -->
  <text
    x="60"
    y="76"
    text-anchor="middle"
    font-family="'Segoe UI', 'Inter', 'Arial Black', sans-serif"
    font-size="46"
    font-weight="900"
    letter-spacing="-1"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >BIQ</text>

  <!-- Underline accent bar -->
  <rect x="28" y="84" width="64" height="3.5" rx="2" fill="url(#textGrad)" opacity="0.55"/>

  <!-- Small tagline -->
  <text
    x="60"
    y="100"
    text-anchor="middle"
    font-family="'Segoe UI', 'Inter', Arial, sans-serif"
    font-size="8.5"
    font-weight="500"
    letter-spacing="3"
    fill="#93c5fd"
    opacity="0.75"
  >BUSINESS IQ</text>
</svg>
